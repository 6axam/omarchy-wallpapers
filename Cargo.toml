[package]
name = "omarchy-wallpapers"
version = "2.0.0"
edition = "2021"
description = "Wallpaper gallery and random rotation for Omarchy"
license = "MIT"

[dependencies]
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
signal-hook = "0.3"
libc = "0.2"
